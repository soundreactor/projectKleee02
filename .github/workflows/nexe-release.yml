name: Nexe Single-File Release (Node 16.16.0)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64-16.16.0
            out: kleee02-win-x64.exe
          - os: ubuntu-latest
            target: linux-x64-16.16.0
            out: kleee02-linux-x64
          - os: macos-latest
            target: mac-x64-16.16.0
            out: kleee02-macos-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16.16.0
      - run: npm ci || npm i
      - run: npm i -D nexe
      - name: Build single-file with nexe
        run: |
          mkdir -p dist
          npx nexe main.js \
            -t "${{ matrix.target }}" \
            -o "dist/${{ matrix.out }}" \
            --resource "fonts/**/*" \
            --resource "token_*.json" \
            --resource "**/*.node"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*/kleee02-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
