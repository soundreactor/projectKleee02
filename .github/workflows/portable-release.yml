name: Portable Release (Node 16.20.2 bundled)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.os }} portable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            node_pkg_url: https://nodejs.org/dist/v16.20.2/node-v16.20.2-win-x64.zip
            archive_ext: zip
          - os: macos-13
            os_name: macos
            node_pkg_url: https://nodejs.org/dist/v16.20.2/node-v16.20.2-darwin-x64.tar.gz
            archive_ext: tar.gz
          - os: ubuntu-22.04
            os_name: linux
            node_pkg_url: https://nodejs.org/dist/v16.20.2/node-v16.20.2-linux-x64.tar.xz
            archive_ext: tar.xz

    env:
      APP_NAME: kleee02
      NODE_VERSION: 16.20.2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (runtime for npm only)
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          check-latest: true

      - name: Install prod deps only
        run: |
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
          else
            npm i --omit=dev
          fi
        shell: bash

      - name: Make portable directory & copy app
        id: prep
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${{ github.workspace }}/dist/${APP_NAME}-${{ matrix.os_name }}-x64-portable-node16"
          rm -rf "$OUT"
          mkdir -p "$OUT/app"
          cp -f package.json "$OUT/app/"
          [ -f package-lock.json ] && cp -f package-lock.json "$OUT/app/" || true
          # entry file; change if not main.js
          cp -f main.js "$OUT/app/"
          # assets (adjust includes as needed)
          rsync -a --prune-empty-dirs --include="*/" --include="fonts/***" --exclude="*" . "$OUT/app/" || true
          rsync -a --include="token_*.json" --exclude="*" . "$OUT/app/" || true
          # installed node_modules for this OS
          rsync -a ./node_modules "$OUT/app/"
          echo "out=$OUT" >> $GITHUB_OUTPUT

      - name: Add launcher script
        shell: bash
        run: |
          OUT="${{ steps.prep.outputs.out }}"
          case "${{ matrix.os_name }}" in
            windows)
              cat > "$OUT/run.cmd" <<'BAT'
@echo off
setlocal
set HERE=%~dp0
"%HERE%node\node.exe" "%HERE%app\main.js" %*
BAT
              ;;
            macos|linux)
              cat > "$OUT/run.sh" <<'SH'
#!/usr/bin/env bash
set -euo pipefail
HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
exec "$HERE/node/bin/node" "$HERE/app/main.js" "$@"
SH
              chmod +x "$OUT/run.sh"
              ;;
          esac

      - name: Download Node ${{ env.NODE_VERSION }} for ${{ matrix.os_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${{ steps.prep.outputs.out }}"
          URL="${{ matrix.node_pkg_url }}"
          TMP="$(mktemp -d)"
          echo "Fetching $URL ..."
          curl -fsSL "$URL" -o "$TMP/node.pkg"
          mkdir -p "$OUT/node"
          case "${{ matrix.archive_ext }}" in
            zip)
              # Windows zip
              bsdtar -x -f "$TMP/node.pkg" -C "$OUT/node" --strip-components 1 || 7z x -y "$TMP/node.pkg" -o"$OUT/node" && \
                [ -d "$OUT/node/node-v${NODE_VERSION}-win-x64" ] && \
                ( shopt -s dotglob nullglob; mv "$OUT/node/node-v${NODE_VERSION}-win-x64"/* "$OUT/node"/ && rmdir "$OUT/node/node-v${NODE_VERSION}-win-x64" ) || true
              ;;
            tar.gz|tar.xz)
              tar -xf "$TMP/node.pkg" -C "$OUT/node" --strip-components 1
              ;;
          esac
          rm -rf "$TMP"

      - name: Pack artifacts
        id: pack
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="${{ steps.prep.outputs.out }}"
          cd "$(dirname "$OUT")"
          BASE="$(basename "$OUT")"
          case "${{ matrix.os_name }}" in
            windows)
              # Always provide a plain ZIP
              zip -r "../${BASE}.zip" "$BASE"
              echo "artifact=dist/${BASE}.zip" >> $GITHUB_OUTPUT

              # Optional: also build SFX .exe if 7z SFX stub is available
              choco install -y 7zip >/nul 2>&1 || true
              if where 7z >nul 2>&1; then
                7z a -t7z -mx9 "../${BASE}.7z" "$BASE" >/nul
                if exist "C:\Program Files\7-Zip\7z.sfx" (
                  (echo ;!@Install@!UTF-8!
                   echo Title=${{ env.APP_NAME }}
                   echo RunProgram="run.cmd"
                   echo ;!@InstallEnd@!) > sfx.txt
                  copy /b "C:\Program Files\7-Zip\7z.sfx"+sfx.txt+"../${BASE}.7z" "../${BASE}.exe" >nul
                  del sfx.txt
                  echo "sfx=dist/${BASE}.exe" >> $GITHUB_OUTPUT
                )
              fi
              ;;
            macos|linux)
              tar -czf "../${BASE}.tar.gz" "$BASE"
              echo "artifact=dist/${BASE}.tar.gz" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "base=$BASE" >> $GITHUB_OUTPUT

      - name: Create/Update GitHub Release and upload
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          ART="${{ steps.pack.outputs.artifact }}"
          SFX="${{ steps.pack.outputs.sfx || '' }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" -t "$TAG" -n "Portable bundles (Node 16.20.2 bundled)"
          gh release upload "$TAG" "$ART" --clobber
          if [ -n "$SFX" ]; then gh release upload "$TAG" "$SFX" --clobber; fi
